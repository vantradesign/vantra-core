name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Changesets needs the full history to work out what changed.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify before releasing
        run: pnpm run verify

      # Opens (or updates) a "Version Packages" PR while changesets are pending.
      # Publishing is handled separately below so that the tarball can carry a
      # provenance attestation, which `changeset publish` cannot produce here.
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # v2 no longer reads the token from the environment, and the version
          # commit is pushed through the GitHub API rather than the Git CLI.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Reached once the version PR has been merged and no changesets remain.
      # The script is a no-op when the current version is already on npm.
      - name: Publish to npm with provenance
        id: publish
        if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.publish.outputs.published == 'true'
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create the GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
